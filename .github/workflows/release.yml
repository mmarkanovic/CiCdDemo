name: Release

# Pokreće se samo kad se napravi oznaka verzije, npr. v1.0
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04        # fiksirana verzija sustava radi ponovljivosti
    timeout-minutes: 30
    environment: release         # tajne iz okruzenja release, dostupne samo za tagove v*

    steps:
      - name: Checkout koda
        uses: actions/checkout@v6

      - name: Postavljanje JDK-a
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Postavljanje Gradlea
        uses: gradle/actions/setup-gradle@v6

      - name: Vracanje keystorea iz tajne u privremenu datoteku
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Testovi i potpisani release build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Brisanje keystorea s runnera
        if: always()               # brise se i ako build padne
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Provjera potpisa
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Spremanje potpisanog APK-a i AAB-a
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab